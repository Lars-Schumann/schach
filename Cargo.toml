[package]
name = "schach"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = { version = "0.9.2", optional = true }
rayon = { version = "1.11.0", default-features = false, optional = true }
serde = { version = "1.0.228", features = [
    "alloc",
    "serde_derive",
], default-features = false, optional = true }

[dev-dependencies]
owlchess = "0.4.0"

[features]
std = []
rand = ["dep:rand"]
rayon = ["dep:rayon"]
serde = ["dep:serde"]
